# Komodo ResourceSync `komodo-resources`: Servers, the Repo, the reconcile Procedure and all 30 Stacks. Applied
# by hand after reading the pending diff (docs/services/komodo.md). Entry rules and absences: komodo-migration.md §4.

[[server]]
name = "nas"
[server.config]
address = "https://192.168.178.111:8120"  # periphery root /mnt/apps/komodo, not /etc (F4)
enabled = true
auto_prune = false  # decided 2026-09-15: no image prune before Komodo owns the stacks

[[server]]
name = "micro-vps"
[server.config]
address = "https://100.64.0.12:8120"  # inbound over the tailnet (F6)
enabled = true
auto_prune = false  # decided 2026-09-15: no image prune before Komodo owns the stacks

[[server]]
name = "a1-vps"
[server.config]
address = "https://100.64.0.13:8120"
enabled = true
auto_prune = false  # decided 2026-09-15: no image prune before Komodo owns the stacks

[[server]]
name = "runner-vm"
[server.config]
address = "https://192.168.178.34:8120"  # the TrueNAS VM on br0; FritzBox reservation for its MAC
enabled = true
auto_prune = false

[[repo]]
name = "nas"
[repo.config]
git_provider = "github.com"
repo = "drizzelat/NAS"
branch = "main"
git_account = "drizzelat"  # read-only token, created in the UI at bootstrap

# The reconcile backstop for Komodo-owned stacks (F10, F16): a deploy-stacks run GitHub evicted, or a
# DeployStack dropped because the stack was busy, is picked up within the hour. With nothing pending
# DeployStackIfChanged recreates nothing. Deploys from here get no health gate; the §1 probe sees them.
[[procedure]]
name = "reconcile-owned"
description = "Deploys each Komodo-owned stack whose compose changed since its last deploy. Backstop for lost deploy-stacks runs."
[procedure.config]
schedule_format = "Cron"
schedule = "0 23 * * * *"  # sec min hour dom month dow: hourly at :23, clear of the :47 probe slots
schedule_timezone = "UTC"
schedule_enabled = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Deploy owned stacks if changed"
# Plain names only, exactly komodo/owned-stacks (scripts/komodo/check-owned.sh enforces both). Never a
# wildcard or a regex: a Stack that was never deployed counts as changed, so "*" would adopt all 29.
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "a1-vps-beszel-agent, a1-vps-ntp, a1-vps-tor-bridge, a1-vps-webtunnel, a1-vps-matrix, a1-vps-kuma, micro-vps-beszel-agent, micro-vps-ingress, beszel, homarr, mealie, romm, books, games, files, paperless, immich, arr, downloads, jellyfin, conduit, snowflake, observability, kuma, authentik, adguard, tailscale, caddy" },
]

# The runner's own deploy path (plan F27): no CI job deploys the runner it runs on. Hourly, and the
# Stack's pre_deploy waits until no job is running, so the recreate lands between jobs.
[[procedure]]
name = "deploy-runner"
description = "Deploys github-runner on runner-vm when its compose changed, between jobs. The Stack's pre_deploy waits for an idle runner."
[procedure.config]
schedule_format = "Cron"
schedule = "0 53 * * * *"  # hourly at :53, clear of reconcile-owned at :23 and the :47 probe slots
schedule_timezone = "UTC"
schedule_enabled = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Deploy github-runner if changed"
executions = [
  { execution.type = "DeployStackIfChanged", execution.params.stack = "github-runner" },
]

