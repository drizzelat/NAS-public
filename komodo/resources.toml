[[stack]]
name = "caddy"
[stack.config]
server = "nas"
linked_repo = "nas"
run_directory = "stacks/caddy"
file_paths = ["docker-compose.yml"]
project_name = "caddy"
auto_pull = true
destroy_before_deploy = false
webhook_enabled = true
# A Caddyfile-only change leaves the container Running, so the reload is the deploy. Lines chain with &&:
# a mounted Caddyfile that is not the clone's (a re-clone orphans the mount, F28) fails before reloading.
post_deploy.command = """
docker exec caddy cat /etc/caddy/Caddyfile | cmp - Caddyfile
docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
"""
environment = """
CROWDSEC_API_KEY=[[CADDY__CROWDSEC_API_KEY]]
CLOUDFLARE_API_TOKEN=[[CADDY__CLOUDFLARE_API_TOKEN]]
"""

[[stack]]
name = "github-runner"
[stack.config]
server = "runner-vm"
linked_repo = "nas"
run_directory = "stacks/github-runner"
file_paths = ["docker-compose.yml"]
project_name = "github-runner"
auto_pull = true
destroy_before_deploy = false
webhook_enabled = true
# Any deploy, from deploy-runner or the UI, waits for the job in progress to finish (up to an hour).
pre_deploy.command = "sh ../../scripts/komodo/runner-idle.sh github-runner 3600"
environment = """
RUNNER_PAT=[[GITHUB_RUNNER__RUNNER_PAT]]
"""
