name: secret-scan

# Block hard-coded secrets from entering the repo (AGENTS.md rule).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so pushed commits and PR ranges are all scanned.
          fetch-depth: 0
      - name: gitleaks
        # gitleaks CLI, not gitleaks-action@v2: the action's PR path needs
        # pull-requests:write and an org license gate, which broke every pull_request run.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .
