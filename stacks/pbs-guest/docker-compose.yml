# A tailnet node that forwards only :443 (a TLS-terminating Caddy), :8006 (PVE UI) and :8007 (PBS) to the pbs stack; shared with a guest. Docs: docs/services/pbs-guest.md
x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: pbs-guest
    hostname: pbs-guest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - proxy_pbs   # reaches `pbs` and `pbs-tunnel` by name, nothing else of the NAS
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}   # one-off key, only read on the first start
      - TS_HOSTNAME=pbs-guest
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true   # no tun device or NET_ADMIN; the forwards below are plain TCP
      - TS_SERVE_CONFIG=/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false --accept-routes=false
    configs:
      - source: serve
        target: /serve.json
    volumes:
      - /mnt/apps/pbs/guest:/var/lib/tailscale
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  caddy:
    # Same custom build as the edge Caddy (Cloudflare DNS plugin). Serves only pbs., pve., hedgedoc. and the lecture task names to the guest;
    # the edge Caddy is never reachable from here. Docs: docs/services/pbs-guest.md
    image: ghcr.io/drizzelat/nas-caddy:2.11.9@sha256:0f5e82ff5a47855f5975fa7422848202ed0069c73e5eb54b17ebb05cb04f36d3
    container_name: pbs-guest-caddy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - proxy_pbs
    security_opt:
      - no-new-privileges=true
    cap_drop:   # no read_only: Docker cannot create the Caddyfile mount point on a read-only rootfs
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: Europe/Berlin
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}   # DNS-01 for the wildcard; a Komodo Variable from the vault
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - /mnt/apps/pbs/guest-caddy:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

configs:
  serve:
    content: |
      {"TCP": {
        "443": {"TCPForward": "pbs-guest-caddy:443"},
        "8006": {"TCPForward": "pbs-tunnel:8006"},
        "8007": {"TCPForward": "pbs:8007"}
      }}

  caddyfile:
    content: |
      *.example.com {
        tls {
          dns cloudflare {env.CLOUDFLARE_API_TOKEN}
        }
        @pbs host pbs.example.com
        handle @pbs {
          reverse_proxy https://pbs:8007 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @pve host pve.example.com
        handle @pve {
          reverse_proxy https://pbs-tunnel:8006 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @hedgedoc host hedgedoc.example.com
        handle @hedgedoc {
          reverse_proxy https://pbs-tunnel:3443 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @task1 host task1-wildcam.example.com
        handle @task1 {
          reverse_proxy https://pbs-tunnel:4443 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @task1traefik host task1-traefik.example.com
        handle @task1traefik {
          rewrite @not_dashboard /dashboard{uri}
          reverse_proxy https://pbs-tunnel:4443 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @task2 host task2-wildcam.example.com
        handle @task2 {
          reverse_proxy https://pbs-tunnel:5443 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @task2traefik host task2-traefik.example.com
        handle @task2traefik {
          rewrite @not_dashboard /dashboard{uri}
          reverse_proxy https://pbs-tunnel:5443 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }
        @not_dashboard not path /api /api/* /dashboard /dashboard/*   # -traefik names: everything else goes to the dashboard
        handle {
          abort
        }
      }

networks:
  proxy_pbs:
    external: true
