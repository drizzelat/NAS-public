# Tor Snowflake proxy: outbound-only WebRTC relay for censored users. Docs: docs/services/snowflake.md
x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  snowflake-proxy:
    image: thetorproject/snowflake-proxy:v2.15.1@sha256:a040427f567692d1ffd23a99f419f7e7b4557ff6c9555dedea35702affd996ae
    container_name: snowflake-proxy
    restart: unless-stopped
    logging: *default-logging
    network_mode: host   # WebRTC NAT traversal without a Docker NAT layer on top of CGNAT
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # No -capacity: with a cap set, a late client returns its slot twice and the proxy deadlocks
    command:
      - "-metrics"
      - "-metrics-address=192.168.1.111"   # not localhost: victoriametrics is on a bridge network
      - "-metrics-port=9999"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
