# Example only. The deployed file is private; this shows its structure, not its SNI allowlist.
# Mounted read-only; bump `config-rev` in ../docker-compose.yml so a change recreates the container.

events {}

stream {
    # Cloudflare's published ranges (https://www.cloudflare.com/ips/); these are placeholders.
    # A gray-clouded name publishes this VPS's address, so without this gate anyone could send an
    # orange-clouded name's SNI here directly and skip Cloudflare's WAF.
    geo $cf_edge {
        default         0;
        198.51.100.0/24 1;
        2001:db8::/32   1;
    }

    # SNI allowlist keyed on "<is the peer Cloudflare>:<SNI>". Upstream is the NAS Caddy's
    # PROXY-protocol listener over the tailnet. An empty result closes the connection.
    map "$cf_edge:$ssl_preread_server_name" $public_upstream {
        "1:public.example.com" 100.64.0.11:8443;
        # Gray-clouded: must answer from any source, so both keys are listed.
        "0:media.example.com"  100.64.0.11:8443;
        "1:media.example.com"  100.64.0.11:8443;
        default                "";
    }

    # :80 only carries ACME and HTTPS redirects.
    server {
        listen 80;
        proxy_pass 100.64.0.11:80;
    }

    # SNI passes through untouched; PROXY protocol carries the real client IP to Caddy.
    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $public_upstream;
    }
}
