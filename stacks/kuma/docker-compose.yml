x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  uptime-kuma:
    image: ghcr.io/louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_RAW
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    # Resolve internal *.example.com via AdGuard directly on proxy_adguard. The host
    # LAN IP routes through Docker UDP hairpin NAT, which drops the query.
    dns:
      - 172.16.25.3
    networks:
      - default
      - proxy_kuma
      - proxy_adguard
    environment:
      - TZ=Etc/UTC
      - UPTIME_KUMA_PORT=31050
    volumes:
      - /mnt/apps/kuma:/app/data
    healthcheck:
      test:
        - CMD
        - extra/healthcheck
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
networks:
  proxy_kuma:
    external: true
  proxy_adguard:
    external: true
