x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  broker:
    image: docker.io/library/redis:8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3
    container_name: paperless-redis
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - /mnt/apps/paperless/redis:/data

  db:
    labels:
      nas.backup.dump: "true"
      nas.backup.user: paperless
      nas.backup.db: paperless
      nas.backup.dir: /mnt/apps/paperless/dumps
    image: docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: paperless-db
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    volumes:
      # postgres:18+ stores data in a version-specific subdir; mount the parent.
      - /mnt/apps/paperless/db:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PW}
      PGDATA: /var/lib/postgresql/18/docker

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
    container_name: paperless
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    healthcheck:
      # paperless-ngx image ships curl; web UI answers on 8000 once migrations finish.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      - db
      - broker
    networks:
      - default
      - proxy_paperless
    volumes:
      - /mnt/apps/paperless/data:/usr/src/paperless/data
      - /mnt/data/paperless/media:/usr/src/paperless/media
      - /mnt/data/paperless/export:/usr/src/paperless/export
      - /mnt/data/paperless/consume:/usr/src/paperless/consume
    environment:
      # Mandatory since paperless-ngx 3.0. Value lives in the encrypted stack env and is
      # written to Komodo with `scripts/secrets.sh push paperless`.
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PW}
      PAPERLESS_URL: https://paperless.example.com
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.example.com

networks:
  proxy_paperless:
    external: true
