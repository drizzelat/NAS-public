x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Tails the Caddy access log, enriches it, and fans out: logs to VictoriaLogs,
  # derived counters to VictoriaMetrics. Adding a source = one file in vector/.
  vector:
    image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
    container_name: vector
    restart: unless-stopped
    logging: *default-logging
    command: ["--config-dir", "/etc/vector", "--watch-config"]
    environment:
      TZ: Europe/Berlin
    volumes:
      # The DIRECTORY, not the files: git replaces inodes on pull and a single-file
      # mount pins the old one forever. Same trap as the Caddyfile.
      - /mnt/apps/komodo/repos/nas/stacks/observability/vector:/etc/vector:ro
      - /mnt/apps/caddy/logs:/var/log/caddy:ro
      - /mnt/apps/observability/geoip:/geoip:ro
      # Read checkpoints, so a restart does not re-ingest the whole log.
      - /mnt/apps/observability/vector:/var/lib/vector
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    depends_on:
      - victorialogs
      - victoriametrics
    networks:
      - default

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    container_name: victorialogs
    restart: unless-stopped
    logging: *default-logging
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=90d"
      - "-httpListenAddr=:9428"
    volumes:
      - /mnt/apps/observability/victorialogs:/victoria-logs-data
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - default

  # Also the scraper: -promscrape.config removes the need for a separate vmagent.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
    container_name: victoriametrics
    restart: unless-stopped
    logging: *default-logging
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:8428"
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      # Re-reads scrape.yml on this interval, so the deploy's git pull applies it.
      - "-promscrape.configCheckInterval=1m"
    volumes:
      - /mnt/apps/komodo/repos/nas/stacks/observability/victoriametrics:/etc/victoriametrics:ro
      - /mnt/apps/observability/victoriametrics:/victoria-metrics-data
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    # One network per scraped stack: proxy_network reaches crowdsec:6060,
    # proxy_authentik reaches server:9300, proxy_downloads reaches gluetun:9022/9023
    # (qBittorrent + SABnzbd exporters), proxy_arr the exportarr-* sidecars and
    # proxy_jellyfin jellyfin-exporter:9594. Joining a stack's INTERNAL network
    # (authentik_net, immich's default, ...) would also put this next to its
    # database — always scrape over the proxy_ network the service already exposes.
    networks:
      - default
      - proxy_network
      - proxy_authentik
      - proxy_downloads
      - proxy_arr
      - proxy_jellyfin

  # Evaluates the alerting rules. -notifier.blackhole: there is no Alertmanager, because
  # the only working mail path here is the TrueNAS one. docs/services/observability.md#alerting
  vmalert:
    image: victoriametrics/vmalert:v1.153.0@sha256:0c1c7718b54b03e8559d0f257f31f1bd79ef7fa32ac6e9ed90d7b92a74a4fe76
    container_name: vmalert
    restart: unless-stopped
    logging: *default-logging
    command:
      - "-rule=/etc/vmalert/*.yml"
      - "-datasource.url=http://victoriametrics:8428"
      - "-notifier.blackhole"
      - "-httpListenAddr=:8880"
      - "-rule.resendDelay=1h"
      - "-configCheckInterval=1m"  # re-reads the rules after deploy-stacks pulls the clone
    volumes:
      - /mnt/apps/komodo/repos/nas/stacks/observability/vmalert:/etc/vmalert:ro
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      # Host loopback only: scripts/vmalert-mail.sh polls /api/v1/alerts from the host.
      - "127.0.0.1:8880:8880"
    depends_on:
      - victoriametrics
    networks:
      - default

  # The NAS host's CPU, memory, network, disk I/O and temperatures, plus the textfile scripts/host-metrics.sh
  # writes. Host network for the real NICs, bound to the LAN IP. docs/services/observability.md#host-metrics
  node-exporter:
    image: prom/node-exporter:v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    read_only: true
    command:
      - "--web.listen-address=192.168.1.111:9100"
      - "--web.disable-exporter-metrics"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.loadavg"
      - "--collector.hwmon"
      - "--collector.netdev"
      - "--collector.netdev.device-include=^(en.*|tailscale0)$$"   # $$: compose interpolation escape
      - "--collector.diskstats"
      - "--collector.diskstats.device-include=^(nvme[0-9]+n[0-9]+|sd[a-z]+)$$"
      - "--collector.vmstat"
      - "--collector.vmstat.fields=^oom_kill$$"
      - "--collector.pressure"
      - "--collector.textfile"
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /mnt/apps/observability/textfile:/textfile:ro
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Europe/Berlin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.example.com
      # LAN-only behind Caddy; nothing should self-register.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - /mnt/apps/komodo/repos/nas/stacks/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - /mnt/apps/komodo/repos/nas/stacks/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - /mnt/apps/observability/grafana:/var/lib/grafana
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    depends_on:
      - victorialogs
      - victoriametrics
    networks:
      - default
      - proxy_observability

  # Daemon mode: refreshes the mmdb files Vector reads every GEOIPUPDATE_FREQUENCY
  # hours. Without it geo lookups go stale, not broken.
  geoipupdate:
    image: maxmindinc/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    container_name: geoipupdate
    restart: unless-stopped
    logging: *default-logging
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City GeoLite2-ASN
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - /mnt/apps/observability/geoip:/usr/share/GeoIP
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - default

networks:
  default:
    name: observability_net
  proxy_observability:
    external: true
  proxy_network:
    external: true
  proxy_authentik:
    external: true
  proxy_downloads:
    external: true
  proxy_arr:
    external: true
  proxy_jellyfin:
    external: true
