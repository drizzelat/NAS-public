apiVersion: 1

datasources:
  # Plugin, installed via GF_INSTALL_PLUGINS in the compose file.
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    editable: false

  # VictoriaMetrics speaks the Prometheus API, so no second plugin is needed.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
