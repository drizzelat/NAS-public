apiVersion: 1

providers:
  # Read-only by design: these come from git. Iterate in a hand-made folder, then
  # export the JSON back into stacks/observability/grafana/dashboards/.
  - name: nas-git
    orgId: 1
    folder: NAS (git)
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
