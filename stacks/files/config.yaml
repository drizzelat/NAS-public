# Read-only from the on-NAS repo clone. Do NOT add a second `*-config.yaml` here:
# Quantum merges every sibling matching that suffix into this file.
server:
  database:
    path: "/state/filebrowser.sqlite"
    # One-time v1 BoltDB import; no-op once the SQLite file is populated. docs/services/files.md → Upgrade.
    migrateFrom: "/state/database.db.old"
  cacheDir: "/state/cache"
  cacheDirCleanup: true
  disableUpdateCheck: true
  sources:
    - path: "/srv/smb_share"
      name: "smb_share"
      config:
        defaultEnabled: true
        defaultUserScope: "/"
        createUserDir: false
        # v2 moved file permissions from the user to the source; every user gets all of them.
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true
  logging:
    - levels: "info|warning|error"

http:
  port: 30052
  baseURL: "/"
  # Share links are built from this. It must be the public name, not the container.
  externalUrl: "https://files.example.com"
  # OIDC redirect_uri comes from X-Forwarded-*, not externalUrl. Safe: only Caddy reaches the port.
  trustProxyHeaders: true

frontend:
  name: "NAS Files"

auth:
  methods:
    # Authentik is the ONLY login — no local break-glass. Recovery is to flip this
    # back to true and redeploy. See docs/services/files.md.
    password:
      enabled: false
    oidc:
      enabled: true
      issuerUrl: "https://auth.example.com/application/o/files/"
      scopes: "openid email profile"
      userIdentifier: "preferred_username"
      groupsClaim: "groups"
      # The Authentik group, reused rather than a files-specific one: whoever is an
      # Authentik admin is an admin here. Exact name match, space included.
      adminGroup: "authentik Admins"
      logoutRedirectUrl: "https://auth.example.com/application/o/files/end-session/"
      # clientId/clientSecret come from FILEBROWSER_OIDC_CLIENT_ID/_SECRET.

userDefaults:
  account:
    loginMethod: "oidc"
    lockPassword: true
    disableUpdateNotifications: true
    # Who may log in at all is the Authentik application binding, not these.
    permissions:
      admin: false
      api: false
      share: true
      realtime: true
  ui:
    darkMode: true
  listing:
    showHidden: false
