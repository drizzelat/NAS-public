x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  github-runner:
    image: myoung34/github-runner:2.338.2-ubuntu-noble@sha256:23e3a4a1da30de5b462ad0ae13d901288e803a688075c3b9b5bb79b7148c07fa
    container_name: github-runner
    restart: unless-stopped
    logging: *default-logging
    # This container EXECUTES workflow code, on the runner VM (Komodo Server runner-vm). Safe only while
    # the repo is private, no docker.sock is mounted, and no pull_request workflows run here.
    # Deployed by Komodo's deploy-runner Procedure between jobs, never by CI. Docs: docs/services/github-runner.md
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - REPO_URL=https://github.com/drizzelat/NAS
      - RUNNER_SCOPE=repo
      - RUNNER_NAME=runner-vm
      # Every self-hosted workflow's runs-on names this label; renaming it strands them all.
      - LABELS=nas
      - EPHEMERAL=true
      # SEC-1: keep the registration credential out of reach of job code. It is in the container's
      # env, so the entrypoint processes hold it; with the default RUN_AS_ROOT=true
      # every job could read them. RUN_AS_ROOT=false runs the Listener (and so every job) as `runner`
      # through gosu, which cannot read those root-owned environ files; UNSET_CONFIG_VARS drops the
      # token from the entrypoint before the Listener starts. no-new-privileges above keeps the image's passwordless
      # sudo from undoing that. No self-hosted job needs root (docs/services/github-runner.md).
      - UNSET_CONFIG_VARS=true
      - RUN_AS_ROOT=false
      # Registration through the GitHub App drizzelat-nas-runner (SEC-1 step 1): installed on this repo
      # only, Administration write + metadata read, so it mints registration tokens but holds no
      # contents access. The key is one line with literal \n, which the entrypoint turns back into
      # newlines; APP_LOGIN defaults to the REPO_URL owner. From the Komodo Variables
      # GITHUB_RUNNER__APP_ID / __APP_PRIVATE_KEY (scripts/secrets.sh komodo-vars github-runner).
      # Never set ACCESS_TOKEN alongside: the entrypoint refuses both at once.
      - APP_ID=${APP_ID}
    # The key is a Compose secret, not an environment entry: `compose config`, which Komodo logs on every
    # deploy, folds long values at their spaces, so the key escaped Komodo's redaction and sat in the
    # deploy log in clear. A secret shows there by name only. mode 0400 root keeps it from job code
    # (uid 1001); Compose warns that mode is Swarm-only but honours it, and the default is 0444.
    secrets:
      - source: app_private_key
        uid: "0"
        gid: "0"
        mode: 0400
    # The image's own ENTRYPOINT and CMD, with the key loaded first: the entrypoint expects it in the env.
    entrypoint:
      - /bin/bash
      - -c
      - 'APP_PRIVATE_KEY=$$(cat /run/secrets/app_private_key) && export APP_PRIVATE_KEY && exec /entrypoint.sh "$$@"'
      - entrypoint
    command: ["./bin/Runner.Listener", "run", "--startuptype", "service"]

secrets:
  app_private_key:
    environment: APP_PRIVATE_KEY
