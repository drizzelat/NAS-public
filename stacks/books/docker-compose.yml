# Shelfmark book library. Docs: docs/services/books.md
services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.3.15@sha256:9602290324993c801b319d3166b202b96bd9039af2416f0916dae03a5bdca815
    container_name: shelfmark
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Vienna
    volumes:
      - /mnt/apps/mediaserver/config/shelfmark:/config
      - /mnt/data/mediaserver/data/media/books:/books
    networks:
      - default
      - media_net
      - proxy_books
    restart: unless-stopped
networks:
  proxy_books:
    external: true
  media_net:
    external: true
