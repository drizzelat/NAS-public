# Shelfmark book library. Docs: docs/services/books.md
x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.5.1@sha256:acfa46b8be80f1e2f084a7703ff027ab274397feb24006114e92c05c140b62c3
    container_name: shelfmark
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Berlin
    volumes:
      - /mnt/apps/mediaserver/config/shelfmark:/config
      - /mnt/data/mediaserver/data/media/books:/books
    networks:
      - default
      - media_net
      - proxy_books
    restart: unless-stopped
    logging: *default-logging
networks:
  proxy_books:
    external: true
  media_net:
    external: true
