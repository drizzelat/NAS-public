  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --border: rgba(255,255,255,.10); --grid: #2c2c2a; --edge: 195,194,183; --new: #d95926; --sel: #f0efec;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {

}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;

  background: var(--surface); border-bottom: 1px solid var(--border);
}
h1 { font-size: 16px; font-weight: 600; margin: 0; }
#stats { color: var(--ink-2); font-size: 12px; flex: 1 1 240px; min-width: 0; }
.count { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.count[hidden] { display: none; }
.count input { width: 150px; accent-color: var(--ink-2); }

.search { position: relative; flex: 0 1 280px; min-width: 160px; }
input[type=search] {

<body>
<header>
  <h1>Craft Graph</h1>
  <div class="search">
    <input id="q" type="search" placeholder="Find an element" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-label="Find an element">
    <ul id="sugg" role="listbox" hidden></ul>
  </div>
  <label class="count" title="How many elements to draw, shallowest first"><span>Show</span>
    <input id="count" type="range" min="0" max="0" step="1" aria-label="Number of elements shown"><output id="countOut" for="count"></output></label>
  <button id="fitbtn" type="button" title="Show the whole graph">Fit</button>
  <button id="edges" type="button" aria-pressed="true" title="Draw every parent to result edge">Edges: on</button>
  <button id="theme" type="button" title="Theme: follows the system, click to force dark or light">Theme: auto</button>
  <div id="stats"></div>
</header>
<main id="stage">
  <canvas id="cv" aria-label="Recipe graph. Tap or click an element for its recipe path; use the search box to find one."></canvas>
  <div id="tip" hidden></div>
  <aside id="panel" hidden aria-live="polite"><button id="close" type="button" aria-label="Close">×</button><div id="pbody"></div></aside>
  <div id="legend"><div>Depth: steps from Water, Fire, Wind, Earth</div><div class="bar" id="bar"></div>
    <div class="ends"><span>0</span><span id="maxd"></span></div>
    <div><i></i>first discovery · ringed = starter</div></div>
  <div id="err"></div>
  <div id="busy" hidden></div>
  <div id="empty" hidden><div><b>No recipes yet</b><br>Import the dump or run the crawler, then regenerate this page.</div></div>
</main>

<script>
"use strict";
const DATA = /*__DATA__*/null;
(function () {
const $ = (id) => document.getElementById(id);

  i, name: n[0], emoji: n[1], depth: n[2], uses: n[3], isNew: !!n[4], best: n[5] >= 0 ? [n[5], n[6]] : null,
  r: Math.min(12, 1.8 + 0.9 * Math.log2(1 + n[3])), x: 0, y: 0, placed: false, // area grows with use, but thousands must still fit

$("edges").addEventListener("click", () => { showEdges = !showEdges; dirty = true; syncEdgesBtn(); requestDraw(); });

const rel = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  const [sx, sy] = rel(e);
  pointers.set(e.pointerId, { sx, sy });
  anim++;
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { d: Math.hypot(p.sx - q.sx, p.sy - q.sy), k: view.k }; drag = null; return;
  }
  const n = pick(sx, sy);
  drag = { node: n, sx, sy, vx: view.x, vy: view.y, moved: false };
});
cv.addEventListener("pointermove", (e) => {
  const [sx, sy] = rel(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { sx, sy });
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()], cx = (p.sx + q.sx) / 2, cy = (p.sy + q.sy) / 2;
    zoomAt(cx, cy, pinch.k * Math.hypot(p.sx - q.sx, p.sy - q.sy) / pinch.d);
    return;
  }
  if (drag) {
    if (!drag.moved && Math.hypot(sx - drag.sx, sy - drag.sy) > 4) {
      drag.moved = true;
      if (drag.node) { drag.node.fx = drag.node.x; drag.node.fy = drag.node.y; simActive = true; sim.alphaTarget(0.2).restart(); }
    }
    if (drag.moved) {
      if (drag.node) { [drag.node.fx, drag.node.fy] = toWorld(sx, sy); }
      else { view.x = drag.vx + sx - drag.sx; view.y = drag.vy + sy - drag.sy; requestDraw(); }
    }
    return;
  }
  if (e.pointerType === "mouse") {
    const n = pick(sx, sy);
    if (n !== hover) { hover = n; cv.classList.toggle("hover", !!n); requestDraw(); }
    showTip(n, sx, sy);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!drag) return;
  const d = drag; drag = null;
  if (d.node) { d.node.fx = d.node.fy = null; sim.alphaTarget(0); }
  if (!d.moved && e.type === "pointerup") select(d.node ? d.node.i : null, false);
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { if (hover) { hover = null; showTip(null); requestDraw(); } });
function zoomAt(sx, sy, k) {
  k = Math.min(40, Math.max(0.03, k));
  const [wx, wy] = toWorld(sx, sy);
  view.k = k; view.x = sx - wx * k; view.y = sy - wy * k;
  requestDraw();
}
cv.addEventListener("wheel", (e) => {
  e.preventDefault(); anim++;
  const [sx, sy] = rel(e);
  zoomAt(sx, sy, view.k * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)));
}, { passive: false });

const tip = $("tip");
function showTip(n, sx, sy) {
  if (!n) { tip.hidden = true; return; }
  const rec = recsFor(n);
  tip.innerHTML = `<b>${esc(label(n))}</b><div class="muted">Depth ${n.depth} · used in ${n.uses}${n.isNew ? " · first discovery" : ""}</div>` +
    (rec.length ? `<ul>${rec.slice(0, 6).map(([a, b], j) => `<li>${esc(nodes[a].name)} + ${esc(nodes[b].name)}${j === 0 && n.best ? " ★" : ""}</li>`).join("")}</ul>${rec.length > 6 ? `<div class="muted">+${rec.length - 6} more</div>` : ""}` : "");
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(W - w - 4, sx + 14)) + "px";
  tip.style.top = Math.max(4, Math.min(H - h - 4, sy + 14)) + "px";
}

// ---- search --------------------------------------------------------------------------------------
const q = $("q"), sugg = $("sugg");
let results = [], active = -1;
function closeSugg() { sugg.hidden = true; q.setAttribute("aria-expanded", "false"); active = -1; }
function renderSugg() {
  const t = q.value.trim().toLowerCase();
  if (!t) return closeSugg();
  const pre = [], sub = [];
  for (const n of nodes) { const l = n.name.toLowerCase(); if (l.startsWith(t)) pre.push(n); else if (l.includes(t)) sub.push(n); }
  const rank = (a, b) => a.name.length - b.name.length || a.depth - b.depth;
  results = [...pre.sort(rank), ...sub.sort(rank)].slice(0, 8);
  active = results.length ? 0 : -1;
  sugg.innerHTML = results.map((n, j) => `<li role="option" data-i="${n.i}" aria-selected="${j === active}"><span>${esc(label(n))}</span><small>depth ${n.depth}</small></li>`).join("") || `<li class="muted">No match among the ${shown} shown elements</li>`;
  sugg.hidden = false; q.setAttribute("aria-expanded", "true");
}
function choose(i) { closeSugg(); q.blur(); select(i, true); }
q.addEventListener("input", renderSugg);
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!results.length) return;
    active = (active + (e.key === "ArrowDown" ? 1 : results.length - 1)) % results.length;
    [...sugg.children].forEach((li, j) => li.setAttribute("aria-selected", String(j === active)));
  } else if (e.key === "Enter") {
    const exact = byName.get(q.value.trim().toLowerCase());
    if (exact) choose(exact.i); else if (active >= 0 && results[active]) choose(results[active].i);
  }
});
sugg.addEventListener("pointerdown", (e) => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); choose(+li.dataset.i); } });
q.addEventListener("blur", () => setTimeout(closeSugg, 120));

// ---- how many elements are shown ---------------------------------------------------------------
const M = ALL.length, fmt = (v) => v.toLocaleString("en");
const STEPS = [...new Set([100, 200, 300, 500, 750, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 8000, 10000, 15000, 20000].filter((v) => v < M).concat(M))];
const slider = $("count");
slider.max = STEPS.length - 1;
slider.parentElement.hidden = STEPS.length < 2;
const nearest = (K) => STEPS.reduce((best, v, i) => (Math.abs(v - K) < Math.abs(STEPS[best] - K) ? i : best), 0);
slider.addEventListener("input", () => { $("countOut").textContent = fmt(STEPS[+slider.value]); }); // live label; the layout runs on release
slider.addEventListener("change", () => applyCount(STEPS[+slider.value]));

const hash = new URLSearchParams(location.hash.slice(1));
let pendingSelect = null, pendingFly = false, layoutId = 0;
function applyCount(K, selectAfter) {
  laid = false; simActive = false;
  K = Math.max(1, Math.min(K, M));
  pendingSelect = selectAfter !== undefined ? selectAfter : (selected && selected.i < K ? selected.i : null);
  select(null);
  hover = null; showTip(null);
  shown = K; nodes = ALL.slice(0, K);
  byName = new Map(nodes.map((n) => [n.name.toLowerCase(), n]));
  const e = [];
  for (let k = 0; k < ALLEDGE.length; k += 2) if (ALLEDGE[k] < K && ALLEDGE[k + 1] < K) e.push(ALLEDGE[k], ALLEDGE[k + 1]);
  EDGE = Int32Array.from(e);
  const count = new Array(maxDepth + 1).fill(0);
  nodes.forEach((n) => count[n.depth]++);
  ringR = []; let cum = 0;
  for (let d = 0; d <= maxDepth; d++) { ringR[d] = 14 + 9 * Math.sqrt(cum + count[d] / 2); cum += count[d]; }
  // Elements already placed keep their position; new ones start on their depth ring.
  nodes.forEach((n) => { if (!n.placed) { const a = n.i * 2.399963; n.x = Math.cos(a) * ringR[n.depth]; n.y = Math.sin(a) * ringR[n.depth]; n.placed = true; } });
  const links = [];
  for (const n of nodes) if (n.best) { links.push({ source: n.best[0], target: n.i }); if (n.best[1] !== n.best[0]) links.push({ source: n.best[1], target: n.i }); }
  sim.nodes(nodes); sim.force("link").links(links); sim.alpha(0.5);
  $("stats").textContent = `${fmt(K)} of ${fmt(m.total)} elements${K < m.total ? ` (${fmt(M)} embedded)` : ""} · ${fmt(EDGE.length / 2)} edges · ${fmt(m.recipes)} recipes in DB · source: ${m.source} · ${m.generated}`;
  slider.value = nearest(K); $("countOut").textContent = fmt(K);
  hash.set("n", K); hash.delete("select");
  try { history.replaceState(null, "", "#" + hash.toString()); } catch (err) { /* file:// or sandboxed: the count just is not kept in the URL */ }
  startLayout();
}

function finishLayout() {
  laid = true; $("busy").hidden = true;
  sim.on("tick", requestDraw).on("end", () => { simActive = false; dirty = true; requestDraw(); });
  fit(); dirty = true; draw();
  if (pendingSelect !== null) select(pendingSelect, pendingFly);
  pendingSelect = null; pendingFly = false;
}
function layoutStep(id) {
  if (id !== layoutId) return; // a newer count superseded this layout
  const t0 = performance.now();
  while (performance.now() - t0 < 25 && sim.alpha() > sim.alphaMin()) sim.tick();
  if (sim.alpha() > sim.alphaMin()) {
    const done = Math.log(0.5 / sim.alpha()) / Math.log(0.5 / sim.alphaMin());
    $("busy").textContent = `Laying out ${fmt(nodes.length)} elements… ${Math.round(done * 100)}%`;
    requestAnimationFrame(() => layoutStep(id));
  } else finishLayout();
}
// Small graphs lay out before the first paint. Big ones in 25 ms slices, so the page stays responsive.
function startLayout() {
  const id = ++layoutId;
  if (nodes.length <= 600) { while (sim.alpha() > sim.alphaMin()) sim.tick(); finishLayout(); }
  else { $("busy").hidden = false; requestAnimationFrame(() => layoutStep(id)); }
}

// ---- start --------------------------------------------------------------------------------------
window.craftGraph = { get nodes() { return nodes; }, view, select, setCount: applyCount }; // for poking from the console
resize(); syncEdgesBtn();
if (hash.get("theme") === "dark" || hash.get("theme") === "light") setMode(hash.get("theme")); else buildColors();
const want = parseInt(hash.get("n"), 10) || m.show || 2000;
const first = hash.get("select") && ALL.find((n) => n.name.toLowerCase() === hash.get("select").toLowerCase());
pendingFly = hash.get("fly") !== "0";
// A deep-linked element decides the count too: show enough elements to contain it.
applyCount(first ? Math.max(want, first.i + 1) : want, first ? first.i : null);
})();
</script>
</body>
</html>
