# Komodo Periphery on the Ampere A1 (aarch64), the transport Core deploys through. Applied by hand as project `periphery`
# from /home/ubuntu/periphery/docker-compose.yml over SSH, never by Komodo (docs/services/komodo.md → Rules). Docs: docs/services/a1-vps-periphery.md
x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  periphery:
    # Multi-arch manifest list: the same pin serves amd64 and arm64. Core and every periphery move together.
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:fb4b52961fcce7a31e3776930e422967b6640f653de876f59f26dea243e29beb
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    # Host network, bound to the tailnet IP only (F6: inbound periphery). A published port would do,
    # except Docker SNATs it to the bridge gateway, and PERIPHERY_ALLOWED_IPS could then never see
    # the NAS (measured 2026-09-15).
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Identical path inside and out. /etc/komodo is fine on Ubuntu, unlike the NAS.
      - /etc/komodo:/etc/komodo
    environment:
      TZ: Europe/Berlin
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PRIVATE_KEY: file:/etc/komodo/keys/periphery.key
      # Written by hand from the NAS Core's /mnt/apps/komodo/keys/core.pub before first start, so the
      # first Core to connect is not trusted blindly. Never unset.
      PERIPHERY_CORE_PUBLIC_KEYS: file:/etc/komodo/keys/core.pub
      PERIPHERY_BIND_IP: 100.64.0.13
      # The NAS tailnet address: Core's traffic leaves the NAS through tailscale0.
      PERIPHERY_ALLOWED_IPS: 100.64.0.11
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
