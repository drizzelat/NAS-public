# External watchdog, deliberately on the A1 and NOT on the ingress VPS it watches.
# Docs: docs/services/a1-vps-kuma.md

x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  uptime-kuma:
    image: ghcr.io/louislam/uptime-kuma:2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: a1-uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    ports:
      - "100.64.0.13:3001:3001"
    environment:
      - TZ=Etc/UTC
    volumes:
      # Host bind, not a named volume: the named volume on the old VPS instance had no
      # backup path. Synced to the NAS nightly, see docs/runbooks/backup-restore/a1-matrix-backup.md
      - /opt/kuma/data:/app/data
    healthcheck:
      test:
        - CMD
        - extra/healthcheck
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
