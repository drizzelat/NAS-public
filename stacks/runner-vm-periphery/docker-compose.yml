# Komodo Periphery on the runner VM (x86_64), the transport Core deploys through. Applied by hand as project `periphery`
# from /home/ubuntu/periphery/docker-compose.yml over SSH, never by Komodo (docs/services/komodo.md → Rules). Docs: docs/services/runner-vm-periphery.md
x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  periphery:
    # Multi-arch manifest list: the same pin serves amd64 and arm64. Core and every periphery move together.
    image: ghcr.io/moghtech/komodo-periphery:2.3.3@sha256:fa3f1a641a265216066676950d5eecdf506955a7bafe2f01996135ae93115cd5
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges=true
    # Host network, bound to the VM's LAN address only. A published port would SNAT the caller to the
    # bridge gateway, and PERIPHERY_ALLOWED_IPS could then never see the NAS.
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Identical path inside and out. /etc/komodo is fine on Ubuntu, unlike the NAS.
      - /etc/komodo:/etc/komodo
    environment:
      TZ: Europe/Berlin
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PRIVATE_KEY: file:/etc/komodo/keys/periphery.key
      # Written by hand from the NAS Core's /mnt/apps/komodo/keys/core.pub before first start, so the
      # first Core to connect is not trusted blindly. Never unset.
      PERIPHERY_CORE_PUBLIC_KEYS: file:/etc/komodo/keys/core.pub
      # The FritzBox reservation for this VM (MAC 02:00:00:00:00:01).
      PERIPHERY_BIND_IP: 192.168.1.34
      # Core's container traffic leaves the NAS masqueraded as its LAN address.
      PERIPHERY_ALLOWED_IPS: 192.168.1.111
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
