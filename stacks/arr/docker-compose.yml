# The *arr automation suite. Reaches the download clients as `gluetun` over
# media_net — that hostname lives in each app's own config DB. Docs: docs/services/arr.md
x-logging: &default-logging   # json-file never rotates by default. docs/runbooks/setup-operations/new-service.md
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls167@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    container_name: prowlarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Berlin
    volumes:
      - /mnt/apps/mediaserver/config/prowlarr:/config
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    container_name: radarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Berlin
    volumes:
      - /mnt/apps/mediaserver/config/radarr:/config
      - /mnt/data/mediaserver/data:/data
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    container_name: sonarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Berlin
    volumes:
      - /mnt/apps/mediaserver/config/sonarr:/config
      - /mnt/data/mediaserver/data:/data
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls371@sha256:7ef0e58216900dbce30b123e0eb65f5cb30e36f126de9474acdd2022fb069c54
    container_name: bazarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Berlin
    volumes:
      - /mnt/apps/mediaserver/config/bazarr:/config
      - /mnt/data/mediaserver/data/media:/data/media
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
    container_name: unpackerr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    user: 950:950
    environment:
      - TZ=Europe/Berlin
      - UN_WEBSERVER_LISTEN_ADDR=127.0.0.1:5656   # v1 web UI, loopback only; an empty value does not turn it off
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_KEY}
    volumes:
      - /mnt/apps/mediaserver/config/unpackerr:/config
      - /mnt/data/mediaserver/data:/data
    restart: unless-stopped
    logging: *default-logging

  questarr:
    image: ghcr.io/doezer/questarr:v1.6.0@sha256:495a1648f1ad8dddd4c7f96b4bf817d9d061bfd5608ef520522f0d891415e972
    container_name: questarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Berlin
      - SQLITE_DB_PATH=/app/data/sqlite.db
    volumes:
      - /mnt/apps/mediaserver/config/questarr:/app/data
      - /mnt/data/mediaserver/data:/data
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  # Prometheus exporters for the Media stack dashboard, scraped as exportarr-<app>:9707 over proxy_arr.
  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-sonarr
    command: ["sonarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://sonarr:8989
      - API_KEY=${SONARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-radarr
    command: ["radarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://radarr:7878
      - API_KEY=${RADARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-prowlarr
    command: ["prowlarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://prowlarr:9696
      - API_KEY=${PROWLARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
  exportarr-bazarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-bazarr
    command: ["bazarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://bazarr:6767
      - API_KEY=${BAZARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
    logging: *default-logging
networks:
  proxy_arr:
    external: true
  media_net:
    external: true
