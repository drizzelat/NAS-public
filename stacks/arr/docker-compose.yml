# The *arr automation suite. Reaches the download clients as `gluetun` over
# media_net — that hostname lives in each app's own config DB. Docs: docs/services/arr.md
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls151@sha256:3950b5e48cf4ba9dab78fe14038dd7f062e66b7b4ab368b02c94a13f6a3dae9f
    container_name: prowlarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Vienna
    volumes:
      - /mnt/apps/mediaserver/config/prowlarr:/config
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1.10461-ls307@sha256:1e95b5c13fe015361a9ae1c4d99fc2336816790aaea60fa74b2ffebe076a69e0
    container_name: radarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Vienna
    volumes:
      - /mnt/apps/mediaserver/config/radarr:/config
      - /mnt/data/mediaserver/data:/data
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.18.2971-ls315@sha256:916844aff737c06c12066be9146cc604c104cec66eb8e07e545cb3719a4b771a
    container_name: sonarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Vienna
    volumes:
      - /mnt/apps/mediaserver/config/sonarr:/config
      - /mnt/data/mediaserver/data:/data
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.5.6-ls352@sha256:aaaa087af75a73b7ac765dcc5d748874cfafdb93c23ec9f64fbb481dea291b23
    container_name: bazarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Vienna
    volumes:
      - /mnt/apps/mediaserver/config/bazarr:/config
      - /mnt/data/mediaserver/data/media:/data/media
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
    container_name: unpackerr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    user: 950:950
    environment:
      - TZ=Europe/Vienna
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_KEY}
    volumes:
      - /mnt/apps/mediaserver/config/unpackerr:/config
      - /mnt/data/mediaserver/data:/data
    restart: unless-stopped

  questarr:
    image: ghcr.io/doezer/questarr:v1.4.2@sha256:6faaf75f484a20805309315dd9eb9f1550b039a668efb89c13fc028c72b45485
    container_name: questarr
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Vienna
      - SQLITE_DB_PATH=/app/data/sqlite.db
    volumes:
      - /mnt/apps/mediaserver/config/questarr:/app/data
      - /mnt/data/mediaserver/data:/data
    networks:
      - default
      - media_net
      - proxy_arr
    restart: unless-stopped
  # Prometheus exporters for the Media stack dashboard, scraped as exportarr-<app>:9707 over proxy_arr.
  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-sonarr
    command: ["sonarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://sonarr:8989
      - API_KEY=${SONARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-radarr
    command: ["radarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://radarr:7878
      - API_KEY=${RADARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-prowlarr
    command: ["prowlarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://prowlarr:9696
      - API_KEY=${PROWLARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
  exportarr-bazarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-bazarr
    command: ["bazarr"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      - PORT=9707
      - URL=http://bazarr:6767
      - API_KEY=${BAZARR_KEY}
    networks:
      - default
      - proxy_arr
    restart: unless-stopped
networks:
  proxy_arr:
    external: true
  media_net:
    external: true
